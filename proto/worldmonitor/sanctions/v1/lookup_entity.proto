syntax = "proto3";

package worldmonitor.sanctions.v1;

import "sebuf/http/annotations.proto";

// LookupSanctionEntityRequest searches OpenSanctions by name when a licensed API key is configured.
// Otherwise, or on upstream failure, it searches the local OFAC and Canada SEMA index.
message LookupSanctionEntityRequest {
  // Search text for a sanctioned person, organization, vessel, or aircraft.
  string q = 1 [(sebuf.http.query) = { name: "q" }];
  // Maximum number of matching sanctioned entities to return.
  int32 max_results = 2 [(sebuf.http.query) = { name: "max_results" }];
}

// SanctionEntityMatch is a compact entity match from OpenSanctions or the local index.
message SanctionEntityMatch {
  string id = 1;
  string name = 2;
  string entity_type = 3;
  repeated string country_codes = 4;
  repeated string programs = 5;
}

// LookupSanctionEntityResponse contains name matches from OpenSanctions or the local OFAC and Canada SEMA index.
// The source field identifies the searched provider or local lists.
message LookupSanctionEntityResponse {
  repeated SanctionEntityMatch results = 1;
  int32 total = 2;
  // "opensanctions" identifies an authenticated OpenSanctions search response, including cached or zero-match answers.
  // On local fallback, lists are identified by primary record IDs in the searched index.
  // Merged local records retain only their primary source ID; complete list coverage is not guaranteed.
  // Empty, unavailable, and unsearched states are labelled separately.
  string source = 3;
}
