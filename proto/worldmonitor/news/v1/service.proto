syntax = "proto3";

package worldmonitor.news.v1;

import "sebuf/http/annotations.proto";
import "worldmonitor/news/v1/summarize_article.proto";
import "worldmonitor/news/v1/get_summarize_article_cache.proto";
import "worldmonitor/news/v1/list_feed_digest.proto";
import "worldmonitor/news/v1/list_country_headlines.proto";
import "worldmonitor/news/v1/list_label_changes.proto";
import "worldmonitor/news/v1/error_reports.proto";

// NewsService provides AI-powered article summarization and feed aggregation.
service NewsService {
  option (sebuf.http.service_config) = {base_path: "/api/news/v1"};

  // Generate an article summary with language-model provider selection and fallback support, returning the chosen provider, model and reported processing errors.
  rpc SummarizeArticle(SummarizeArticleRequest) returns (SummarizeArticleResponse) {
    option (sebuf.http.config) = {path: "/summarize-article"};
  }

  // GetSummarizeArticleCache looks up a cached summary by deterministic key (CDN-cacheable GET).
  rpc GetSummarizeArticleCache(GetSummarizeArticleCacheRequest) returns (SummarizeArticleResponse) {
    option (sebuf.http.config) = {path: "/summarize-article-cache", method: HTTP_METHOD_GET};
  }

  // ListFeedDigest returns a pre-aggregated digest of all RSS feeds for a site variant.
  rpc ListFeedDigest(ListFeedDigestRequest) returns (ListFeedDigestResponse) {
    option (sebuf.http.config) = {path: "/list-feed-digest", method: HTTP_METHOD_GET};
  }

  // ListCountryHeadlines reads fresh country reporting from existing RSS caches without fetching publishers or applying dashboard category caps.
  rpc ListCountryHeadlines(ListCountryHeadlinesRequest) returns (ListCountryHeadlinesResponse) {
    option (sebuf.http.config) = {path: "/list-country-headlines", method: HTTP_METHOD_GET};
  }

  // ListLabelChanges returns stories whose corroboration label moved between single-publisher and corroborated in the last seven days, with the publishers behind each change.
  rpc ListLabelChanges(ListLabelChangesRequest) returns (ListLabelChangesResponse) {
    option (sebuf.http.config) = {path: "/list-label-changes", method: HTTP_METHOD_GET};
  }

  // SubmitErrorReport stores a reader's report that a label or story is wrong, for an operator to review. No account required; rate-limited; never applied automatically.
  rpc SubmitErrorReport(SubmitErrorReportRequest) returns (SubmitErrorReportResponse) {
    option (sebuf.http.config) = {path: "/submit-error-report", method: HTTP_METHOD_POST};
  }

  // ListErrorReports lists stored reports for review. Operators only.
  rpc ListErrorReports(ListErrorReportsRequest) returns (ListErrorReportsResponse) {
    option (sebuf.http.config) = {path: "/list-error-reports", method: HTTP_METHOD_GET};
  }

  // ReviewErrorReport accepts or rejects a report. An accepted report's public note is added to the label log. Operators only.
  rpc ReviewErrorReport(ReviewErrorReportRequest) returns (ReviewErrorReportResponse) {
    option (sebuf.http.config) = {path: "/review-error-report", method: HTTP_METHOD_POST};
  }
}
